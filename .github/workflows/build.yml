name: Build Mod
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@v2
        with:
          geode-version: "5.10.1"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.geode
